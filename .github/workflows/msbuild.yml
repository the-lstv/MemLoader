name: Build memloader

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build native addon
        run: npm run build

      - name: Upload memloader.node
        uses: actions/upload-artifact@v4
        with:
          name: memloader-win32-x64
          path: memloader.node
          if-no-files-found: warn
      - name: Upload native binaries
        uses: actions/upload-artifact@v4
        with:
          name: native-build
          path: |
            **/*.dll
            **/*.exe
            **/*.lib
          if-no-files-found: warn
