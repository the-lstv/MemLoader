name: Build MemLoader

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Common
        shell: cmd
        run: |
          msbuild Common\Common.vcxproj ^
            /p:Configuration=Dll ^
            /p:Platform=x64 ^
            /m
      
      - name: Build loaders
        shell: cmd
        run: |
          msbuild MemLoader.sln ^
            /p:Configuration=Dll ^
            /p:Platform=x64 ^
            /m

      - name: Collect artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MemLoader-x64
          path: |
            **\Release\*.dll
            **\Release\*.exe
