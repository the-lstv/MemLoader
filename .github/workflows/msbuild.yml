name: Build MemLoader

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Common
        shell: cmd
        run: |
          msbuild Common\Common.vcxproj ^
            /t:Rebuild ^
            /p:Configuration=Release ^
            /p:Platform=x64 ^
            /p:OutDir=%CD%\x64\Release\
      
      - name: Build PE loader
        shell: cmd
        run: |
          msbuild pe-loader\pe-loader.vcxproj ^
            /p:Configuration=Release ^
            /p:Platform=x64 ^
            /p:OutDir=%CD%\x64\Release\
      
      - name: Build .NET loader
        shell: cmd
        run: |
          msbuild dotnet-loader\dotnet-loader.vcxproj ^
            /p:Configuration=Release ^
            /p:Platform=x64 ^
            /p:OutDir=%CD%\x64\Release\

      - name: Collect artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MemLoader-x64
          path: |
            **\Release\*.dll
            **\Release\*.exe
