name: Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: egor-tensin/setup-clang@v2
        with:
          platform: x64

      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          clang-cl --version
          cmake -S . -B build
          cmake --build build --config Dll

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: |
            build/**/*.dll
            build/**/*.exe
